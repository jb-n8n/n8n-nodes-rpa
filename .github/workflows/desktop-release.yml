# Publishes the Windows package (rpa-windows-x64.zip and its SHA-256) as the GitHub Release desktop-v<version> when a
# desktop-v<version> tag is pushed. The package is the one the desktop workflow builds, installs and drives: this
# workflow calls desktop.yml and publishes the artifact it uploads. The package is not code-signed; the release carries
# the zip's SHA-256 and a build attestation (`gh attestation verify rpa-windows-x64.zip --repo jb-n8n/n8n-nodes-rpa`).
# Four jobs, so third-party code never runs with publish rights (the shape of publish.yml):
# - check (contents: read only, no environment, no secrets): the ref is the tag desktop-v<version>, where <version> is
#   the <Version> of desktop/Directory.Build.props, on a commit that is on main. It cuts the version's section out of
#   CHANGELOG.md for the release notes and uploads them; a missing section fails here, before anything is built.
# - desktop (needs check; contents: read): the reusable desktop workflow, which builds, tests, stages, installs and
#   drives the package and uploads it as the artifact its output names.
# - verify (needs check and desktop; no permissions, no environment): downloads the package and checks it: exactly
#   the two files, the zip's SHA-256 equal to the .sha256 file beside it, the version in the zip equal to the tag's.
# - release (needs all three; environment release; contents/id-token/attestations write): no checkout, no repository
#   code, nothing run from the artifact. It downloads the package and the notes, checks them again, attests the zip
#   and creates the release desktop-v<version>, neither a draft nor a prerelease, and not marked latest (the
#   repository's latest release stays the npm package's). A release that already exists for the tag fails the job.
# Dry run: run this workflow by hand on main (workflow_dispatch, dry_run true, the default). The check uses the version
# of desktop/Directory.Build.props in place of a tag, and everything up to and including verify runs; release is
# skipped, so nothing is attested or published. A dispatch with dry_run false is a release, and its check accepts only
# a desktop-v<version> tag as the ref.
# Uses no repository secrets; the release job uses the automatic token. Actions are pinned by full commit SHA.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check, build and verify the package from desktop/Directory.Build.props, then stop before attesting and releasing
        type: boolean
        default: true

permissions: {}

# Releases run one at a time, and a running release is not cancelled by another run. As in publish.yml, GitHub keeps
# one waiting run per group: a third tag pushed while one release runs and another waits replaces the waiting one
# (shown as cancelled; re-run it). Dry runs wait in their own group, so they never replace a waiting release.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'desktop-release-dry-run' || 'desktop-release' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Full history, so the main-ancestry check below can see origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is desktop-v<version of desktop/Directory.Build.props> and is on main
        id: tag
        env:
          REF: ${{ github.ref }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          mapfile -t versions < <(grep -oE '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>' desktop/Directory.Build.props || true)
          test "${#versions[@]}" -eq 1 || { echo "::error::desktop/Directory.Build.props must hold exactly one <Version>major.minor.patch</Version>"; exit 1; }
          version="${versions[0]//[^0-9.]/}"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: the version is ${version} (desktop/Directory.Build.props), the ref ${REF} is not checked as a tag"
          else
            [[ "$REF" =~ ^refs/tags/desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the Windows package is released only from a desktop-v<major>.<minor>.<patch> tag, not from ${REF}"; exit 1; }
            test "$REF" = "refs/tags/desktop-v${version}" || { echo "::error::tag ${REF#refs/tags/} does not match desktop/Directory.Build.props version ${version}"; exit 1; }
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::commit $GITHUB_SHA is not on main; tag a reviewed commit on main"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The release notes are the CHANGELOG.md section "## <version> (<date>)", up to the next "## " heading, cut as
      # publish.yml cuts them. They are cut here because the release job has no checkout.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes"
          notes="$RUNNER_TEMP/notes/release-notes.md"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes" || { echo "::error::CHANGELOG.md has no section for ${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # No secrets are passed: desktop.yml uses none. Its own concurrency group is desktop-<ref> with cancel-in-progress,
  # so of a dry run from main and a desktop run for a push to main, the later cancels the earlier: dry-run when
  # nothing is merging.
  desktop:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml

  verify:
    needs: [check, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: The artifact is the Windows package
        env:
          ARTIFACT: ${{ needs.desktop.outputs.package-artifact }}
        run: test "$ARTIFACT" = rpa-windows-package || { echo "::error::desktop.yml names the artifact '${ARTIFACT}', not rpa-windows-package"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpa-windows-package
          path: ${{ runner.temp }}/package
      # Only reads the files: the zip's hash, and its VERSION file through unzip -p (the pattern takes either path
      # separator, as the zip is written by .NET on Windows). Nothing from the artifact runs.
      - name: Check the package
        working-directory: ${{ runner.temp }}/package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(*)
          test "${#files[@]}" -eq 2 || { echo "::error::expected two files in the artifact, found ${#files[@]}"; exit 1; }
          for f in rpa-windows-x64.zip rpa-windows-x64.zip.sha256; do
            [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::the artifact holds no regular file $f"; exit 1; }
          done
          line="$(cat rpa-windows-x64.zip.sha256)"
          [[ "$line" =~ ^([0-9a-f]{64})\ \ rpa-windows-x64\.zip$ ]] || { echo "::error::rpa-windows-x64.zip.sha256 is not '<sha-256>  rpa-windows-x64.zip'"; exit 1; }
          expected="${BASH_REMATCH[1]}"
          actual="$(sha256sum rpa-windows-x64.zip | cut -d' ' -f1)"
          test "$actual" = "$expected" || { echo "::error::rpa-windows-x64.zip has the SHA-256 $actual, the .sha256 file says $expected"; exit 1; }
          packaged="$(unzip -p rpa-windows-x64.zip 'rpa-windows-x64[/\\]VERSION' | tr -d '\r\n')" || { echo "::error::rpa-windows-x64.zip holds no rpa-windows-x64/VERSION"; exit 1; }
          test "$packaged" = "$VERSION" || { echo "::error::the package's VERSION is '${packaged}', not ${VERSION}"; exit 1; }
          echo "rpa-windows-x64.zip ${VERSION}, SHA-256 ${actual}"

  release:
    needs: [check, desktop, verify]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment publish.yml's github-release job uses. Before the first desktop release, add `desktop-v*` to its
    # deployment tag policy in the repository settings (publish.yml asks for `v*` only); the policy refuses this job
    # until then. That policy and the environment's reviewers, not the checks in this file, are what stop a release
    # from a tag nobody approved: whoever can push a tag also chooses the workflow file the tag's commit holds.
    environment: release
    permissions:
      contents: write # create the release and upload its assets with GITHUB_TOKEN
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpa-windows-package
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release-notes
          path: ${{ runner.temp }}/notes
      # The same checks as the verify job, on the same artifact: this job must not rely on another job's checks alone.
      - name: Check the tag, the package and the notes
        id: check
        working-directory: ${{ runner.temp }}/release
        env:
          REF: ${{ github.ref }}
          CHECKED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          [[ "$REF" =~ ^refs/tags/desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::the Windows package is released only from a desktop-v<major>.<minor>.<patch> tag, not from ${REF}"; exit 1; }
          version="${BASH_REMATCH[1]}"
          test "$version" = "$CHECKED_VERSION" || { echo "::error::the tag's version ${version} is not the checked version ${CHECKED_VERSION}"; exit 1; }
          files=(*)
          test "${#files[@]}" -eq 2 || { echo "::error::expected two files in the artifact, found ${#files[@]}"; exit 1; }
          for f in rpa-windows-x64.zip rpa-windows-x64.zip.sha256; do
            [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::the artifact holds no regular file $f"; exit 1; }
          done
          line="$(cat rpa-windows-x64.zip.sha256)"
          [[ "$line" =~ ^([0-9a-f]{64})\ \ rpa-windows-x64\.zip$ ]] || { echo "::error::rpa-windows-x64.zip.sha256 is not '<sha-256>  rpa-windows-x64.zip'"; exit 1; }
          expected="${BASH_REMATCH[1]}"
          actual="$(sha256sum rpa-windows-x64.zip | cut -d' ' -f1)"
          test "$actual" = "$expected" || { echo "::error::rpa-windows-x64.zip has the SHA-256 $actual, the .sha256 file says $expected"; exit 1; }
          packaged="$(unzip -p rpa-windows-x64.zip 'rpa-windows-x64[/\\]VERSION' | tr -d '\r\n')" || { echo "::error::rpa-windows-x64.zip holds no rpa-windows-x64/VERSION"; exit 1; }
          test "$packaged" = "$version" || { echo "::error::the package's VERSION is '${packaged}', not ${version}"; exit 1; }
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/release-notes.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${actual}" >> "$GITHUB_OUTPUT"
      # Fails before anything is attested when gh finds a release for the tag, so an existing release is not replaced.
      # gh release create below also fails when a published release has the tag.
      - name: No release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-v${{ steps.check.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::a release ${TAG} exists already; it is not replaced (delete it by hand to release again)"
            exit 1
          fi
      # Storage records need an organization-owned repository and artifact-metadata: write; this posture grants neither.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/rpa-windows-x64.zip
          create-storage-record: false
      # Not a draft, not a prerelease, and --latest=false: the npm package's release stays the repository's latest.
      - name: Create the GitHub Release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          SHA256: ${{ steps.check.outputs.sha256 }}
        run: |
          set -euo pipefail
          tag="desktop-v${VERSION}"
          tick='`'
          fence="${tick}${tick}${tick}"
          {
            cat "$RUNNER_TEMP/notes/release-notes.md"
            echo
            echo '### Windows package'
            echo
            echo "${tick}rpa-windows-x64.zip${tick} holds the RPA runner, the policy tool, the browser host, the ERP Demo app and the installer for Windows x64. It is not code-signed: it comes with its SHA-256 and a build attestation. Check both before you unpack it:"
            echo
            echo "${fence}sh"
            echo "gh attestation verify rpa-windows-x64.zip --repo ${GITHUB_REPOSITORY}"
            echo "sha256sum -c rpa-windows-x64.zip.sha256   # ${SHA256}"
            echo "${fence}"
            echo
            echo "In PowerShell, this prints True when the hash matches:"
            echo
            echo "${fence}powershell"
            echo "(Get-FileHash rpa-windows-x64.zip -Algorithm SHA256).Hash -eq '${SHA256}'"
            echo "${fence}"
            echo
            echo "Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/desktop/README.md#releasing-the-windows-package"
          } > "$RUNNER_TEMP/notes/notes.md"
          gh release create "$tag" rpa-windows-x64.zip rpa-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "RPA Windows package ${VERSION}" --notes-file "$RUNNER_TEMP/notes/notes.md"
