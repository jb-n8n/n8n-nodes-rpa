# Publishes the rpa-browser image (images/browser) to ghcr.io/jb-n8n/rpa-browser when a browser-v<version> tag is pushed,
# or by hand (workflow_dispatch). Images come only from here, never from a laptop: the npm release's posture (CI only,
# tests before publish, provenance, an owner approval gate). Only reviewed code is published: a browser-v* tag whose
# commit is on main, or a dispatch on main; any other ref fails in the first step of each job.
# Two jobs, so third-party code never runs with publish rights:
# - test (contents: read only): installs the workspace (pnpm, lifecycle scripts), builds linux/amd64 and runs the docker
#   tests (images/browser/test) against it.
# - publish (needs test; environment ghcr; packages/id-token/attestations write): no Node, no install, no repository
#   scripts. A fresh builder builds linux/amd64 and linux/arm64 from the Dockerfile with BuildKit provenance and an SBOM,
#   pushes, and attests the pushed digest (`gh attestation verify oci://ghcr.io/jb-n8n/rpa-browser:<version> --owner
#   jb-n8n`).
# Tags: <version> (browser-v0.1.0 -> 0.1.0, tag refs only) and sha-<short commit>; no `latest`.
# CI (ci.yml, job browser-image) builds and tests the same Dockerfile on every pull request without pushing.
# Actions are pinned by full commit SHA; the binfmt and BuildKit images by version and digest.
name: Browser image

on:
  push:
    tags: ['browser-v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: The ref is a browser-v<semver> tag or main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" =~ ^refs/tags/browser-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [ "$REF" = refs/heads/main ]; then
            exit 0
          fi
          echo "::error::the rpa-browser image is published only from a browser-v<major>.<minor>.<patch> tag or from main, not from $REF"
          exit 1
      # Full history and every branch, so the tag's commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::commit $GITHUB_SHA is not on main; tag a reviewed commit on main"
            exit 1
          }
      # The docker tests connect with the engine's playwright-core (as in ci.yml). No dependency cache in a release run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build for the tests (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/browser
          platforms: linux/amd64
          load: true
          push: false
          tags: rpa-browser:publish-test
      - name: Docker tests against the image
        run: node --test "images/browser/test/*.test.js"
        env:
          RPA_DOCKER_TESTS: "1"
          RPA_BROWSER_IMAGE: rpa-browser:publish-test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Configure this environment in the repository settings before the first publish: required reviewers (the owner),
    # so each publish is approved by hand, and a deployment branch/tag policy that allows only the branch `main` and the
    # tags `browser-v*`. Without it, GitHub creates the environment on first use with no protection.
    environment: ghcr
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation
    steps:
      # The same guard as the test job (cheap, and this job must not rely on another job's checks alone).
      - name: The ref is a browser-v<semver> tag or main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" =~ ^refs/tags/browser-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [ "$REF" = refs/heads/main ]; then
            exit 0
          fi
          echo "::error::the rpa-browser image is published only from a browser-v<major>.<minor>.<patch> tag or from main, not from $REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::commit $GITHUB_SHA is not on main; tag a reviewed commit on main"
            exit 1
          }
      # Registry names must be lowercase; the owner may not be.
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/rpa-browser" >> "$GITHUB_OUTPUT"
      # binfmt and BuildKit pinned by version and digest (docker buildx imagetools inspect <image>:<version>). This job's
      # builder is new: nothing from the test job's build (or any cache) goes into the published image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotations on each platform manifest and on the index, so registries show them for the multi-arch tag.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=match,pattern=^browser-v(.*)$,group=1
            type=sha,prefix=sha-
      # No build cache (no cache-from/cache-to): the published image is built from the Dockerfile alone.
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      # Storage records need an organization-owned repository and artifact-metadata: write; this posture grants neither.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
