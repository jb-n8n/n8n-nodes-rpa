# Publishes n8n-nodes-rpa to npm and attaches the same tarball to a GitHub Release when a v<version> tag is pushed.
# Releases come only from here, never from a laptop: npm records a provenance statement (this repository, this workflow,
# the commit), which n8n asks of community nodes, and the GitHub Release carries a build attestation of the tarball.
# Three jobs, so third-party code never runs with publish rights (the shape of browser-image.yml):
# - test (contents: read only, no environment, no secrets): the tag checks (a strict semver tag equal to the package
#   version, on a commit that is on main), install (pnpm 10 blocks dependencies' build scripts and none is allowed, so
#   only the workspace's own scripts run), build, typecheck, lint, tests, acceptance, audit, then scripts/pack.mjs packs
#   the tarball (devDependencies and scripts stripped from its manifest, which is checked). It also cuts the version's
#   section out of CHANGELOG.md for the release notes, and uploads the tarball and the notes as artifacts.
# - npm (needs test; environment npm; id-token write): no checkout, no install, no repository code. It downloads the
#   tarball, checks its manifest against the tag again, and runs npm publish on it.
# - github-release (needs test and npm, so a release appears only once npm has the version; environment release;
#   contents/id-token/attestations write): no checkout, no install, no repository code. It downloads the same tarball
#   and the notes, checks the manifest again, attests the tarball (`gh attestation verify n8n-nodes-rpa-<version>.tgz
#   --repo jb-n8n/n8n-nodes-rpa`) and creates the GitHub Release v<version> with the tarball and its SHA-256.
# npm authentication: npm trusted publishing (OIDC, no token) once it is configured for this workflow on npmjs.com; until
# then, the NPM_TOKEN secret of the "npm" environment. Actions are pinned by full commit SHA.
name: Publish

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    # The Redis GuardStore contract suite runs against this service (database 15), as in ci.yml.
    services:
      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # Full history, so the main-ancestry check below can see origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a release run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag is semver, matches the package version and is on main
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>[-<prerelease>]"; exit 1; }
          version="$(node -p "require('./packages/n8n-nodes-rpa/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::commit $GITHUB_SHA is not on main"; exit 1; }
      # The release notes are the CHANGELOG.md section "## <version> (<date>)", up to the next "## " heading. They are
      # cut here because the github-release job has no checkout; a missing section fails before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes"
          notes="$RUNNER_TEMP/notes/release-notes.md"
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes" || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: npx --yes playwright@1.63.0 install --with-deps chromium
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379/15
      - run: pnpm acceptance
        env:
          ANTHROPIC_API_KEY: ""
      - run: pnpm audit --prod --audit-level high
      # pnpm pack rewrites workspace: versions; pack.mjs then strips devDependencies and scripts (they name unpublished
      # workspace packages) and refuses a manifest with anything but playwright-core, fflate and redis as dependencies.
      - run: node packages/n8n-nodes-rpa/scripts/pack.mjs "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/n8n-nodes-rpa-*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protect this environment (required reviewers) in the repository settings to approve each release by hand.
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm uses for provenance and trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack
      # The tarball is what npm receives, so it is checked again here, with jq only: one file, the right name and the
      # tag's version, no devDependencies or scripts, exactly the three runtime dependencies, no workspace names.
      - name: Check the tarball
        working-directory: ${{ runner.temp }}/pack
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(n8n-nodes-rpa-*.tgz)
          test "${#files[@]}" -eq 1 || { echo "expected one tarball, found ${#files[@]}"; exit 1; }
          manifest="$(tar -xOzf "${files[0]}" package/package.json)"
          test "$(jq -r .name <<<"$manifest")" = n8n-nodes-rpa
          test "v$(jq -r .version <<<"$manifest")" = "${GITHUB_REF_NAME}"
          jq -e 'has("devDependencies") or has("scripts") | not' <<<"$manifest" >/dev/null
          test "$(jq -c '.dependencies | keys' <<<"$manifest")" = '["fflate","playwright-core","redis"]'
          if grep -Eq 'workspace:|n8n-rpa-(engine|eval|sandbox|gate)' <<<"$manifest"; then echo "the manifest names a workspace package"; exit 1; fi
      # Trusted publishing needs npm 11.5.1 or later: Node 24 ships it (Node 22 ships npm 10), so nothing is installed here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: npm is 11.5.1 or later
        run: |
          v="$(npm --version)"
          printf '%s\n' 11.5.1 "$v" | sort -V -C || { echo "npm $v is older than 11.5.1"; exit 1; }
      - name: Publish
        working-directory: ${{ runner.temp }}/pack
        # The check above allows exactly one tarball here.
        run: npm publish ./n8n-nodes-rpa-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [test, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create this environment in the repository settings before the first release, with a deployment tag policy that
    # allows only `v*` (required reviewers are optional: the npm job was approved already). Without it, GitHub creates
    # the environment on first use with no protection. It is its own environment rather than npm's (which holds
    # NPM_TOKEN, a secret this job must not see) or ghcr's (whose policy allows only main and browser-v* tags).
    environment: release
    permissions:
      contents: write # create the release and upload its assets with GITHUB_TOKEN
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # The same checks as the npm job, on the same artifact: this job must not rely on another job's checks alone.
      - name: Check the tarball
        id: check
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          shopt -s nullglob
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>[-<prerelease>]"; exit 1; }
          files=(*.tgz)
          test "${#files[@]}" -eq 1 || { echo "::error::expected one tarball, found ${#files[@]}"; exit 1; }
          tarball="n8n-nodes-rpa-${GITHUB_REF_NAME#v}.tgz"
          test "${files[0]}" = "$tarball" || { echo "::error::the tarball is ${files[0]}, not $tarball"; exit 1; }
          manifest="$(tar -xOzf "$tarball" package/package.json)"
          test "$(jq -r .name <<<"$manifest")" = n8n-nodes-rpa
          test "v$(jq -r .version <<<"$manifest")" = "${GITHUB_REF_NAME}"
          jq -e 'has("devDependencies") or has("scripts") | not' <<<"$manifest" >/dev/null
          test "$(jq -c '.dependencies | keys' <<<"$manifest")" = '["fflate","playwright-core","redis"]'
          if grep -Eq 'workspace:|n8n-rpa-(engine|eval|sandbox|gate)' <<<"$manifest"; then echo "::error::the manifest names a workspace package"; exit 1; fi
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/release-notes.md"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # Storage records need an organization-owned repository and artifact-metadata: write; this posture grants neither.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/${{ steps.check.outputs.tarball }}
          create-storage-record: false
      - name: Create the GitHub Release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.check.outputs.tarball }}
        run: |
          set -euo pipefail
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          sha="$(cut -d' ' -f1 "$TARBALL.sha256")"
          tick='`'
          fence="${tick}${tick}${tick}"
          {
            cat "$RUNNER_TEMP/notes/release-notes.md"
            echo
            echo '### Install'
            echo
            echo "In n8n: **Settings → Community nodes → Install**, package ${tick}n8n-nodes-rpa${tick} (the same tarball, on npm). Or install the tarball attached here: check it, install it into the nodes folder of the n8n main instance and of every worker, then restart n8n:"
            echo
            echo "${fence}sh"
            echo "gh attestation verify ${TARBALL} --repo ${GITHUB_REPOSITORY}"
            echo "sha256sum -c ${TARBALL}.sha256   # ${sha}"
            echo 'npm install --prefix ~/.n8n/nodes --omit=peer --ignore-scripts '"./${TARBALL}"
            echo "${fence}"
            echo
            echo "Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/packages/n8n-nodes-rpa/README.md#install"
          } > notes.md
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "n8n-nodes-rpa ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            "${prerelease[@]}"
