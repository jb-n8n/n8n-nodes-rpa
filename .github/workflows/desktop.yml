# The Windows desktop runner, the ERP Demo app and the Windows package (desktop/, and the browser host the package
# ships from images/browser/): the runner core's unit tests on Linux, then on windows-latest (which has an
# interactive, unlocked desktop):
# - a UI Automation spike, a build and self-contained win-x64 publish of the runner, the policy tool and the demo app
#   (v1 and v2) plus a release zip, and the protocol scenario: the published runner started with a policy and a
#   random token, and a test client driving the demo app through it end to end (sign in, search, read, export to the
#   run's export dir, retrieve the file, end the run) plus the refusals (401, busy, policy, not found, not unique,
#   lease expiry); the recorder core's unit tests, and the recorder scenario: RpaRecorder.exe (its scenario build, the
#   only one with --headless) records the reference flow a stand-in for a person performs with synthetic input,
#   checked against the engine's golden recording;
# - the Windows package: the installer's tests, the browser host's and the gate's tests, the package staged by
#   desktop/installer/build/Stage.ps1, then installed from its zip for a new standard user, the policy changed with
#   the installed policy tool, the installed runner and browser started and driven (the same scenario; a browser
#   session with a window through a tunnel that checks the certificate's fingerprint), an upgrade, and the uninstall;
#   then an install with -Unattended for another new user (the service RPA Supervisor, which signs the bot user in
#   through a Remote Desktop connection from the machine to itself), the scenario through the supervisor, and its
#   uninstall. The package is uploaded as the artifact rpa-windows-package.
# Uses no repository secrets. Actions are pinned by full commit SHA. What the job downloads besides them: the .NET
# packages (NuGet), and for the package Node.js (checked against a SHA-256 written in Stage.ps1), Playwright (npm ci
# against the lockfile in images/browser/server) and Chromium (Playwright's installer; the list of the files it
# installed is checked against a SHA-256 written in Stage.ps1).
name: desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "images/browser/gate/**"
      - "images/browser/host/**"
      - "images/browser/server/**"
      # The engine files the recorder's tests read in place, and the engine rules the recorder's C# twins.
      - "packages/engine/test/fixtures/import/recording-erp/**"
      - "packages/engine/test/fixtures/desktop/stable-id-samples.json"
      - "packages/engine/src/secrets/credential-field.ts"
      - "packages/engine/src/desktop/stable-ids.ts"
      - "packages/engine/src/import/recording.ts"
      - "packages/engine/src/steps/desktop-vocabulary.ts"
      - "packages/engine/src/steps/parse.ts"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "images/browser/gate/**"
      - "images/browser/host/**"
      - "images/browser/server/**"
      # The engine files the recorder's tests read in place, and the engine rules the recorder's C# twins.
      - "packages/engine/test/fixtures/import/recording-erp/**"
      - "packages/engine/test/fixtures/desktop/stable-id-samples.json"
      - "packages/engine/src/secrets/credential-field.ts"
      - "packages/engine/src/desktop/stable-ids.ts"
      - "packages/engine/src/import/recording.ts"
      - "packages/engine/src/steps/desktop-vocabulary.ts"
      - "packages/engine/src/steps/parse.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  # For a workflow that needs the package. Any job of the calling run can upload an artifact of the same name, with a
  # .sha256 file that matches its own zip, before the caller downloads it. So a caller downloads the artifact by its
  # id (package-artifact-id) from its own run, and compares rpa-windows-x64.zip with package-sha256, the hash this
  # workflow computed, not with the .sha256 file inside the artifact.
  workflow_call:
    outputs:
      package-artifact:
        description: The name of the artifact that holds rpa-windows-x64.zip, rpa-windows-x64.zip.sha256 and Get-Rpa.ps1
        value: ${{ jobs.windows.outputs.package-artifact }}
      package-artifact-id:
        description: The id of that artifact in the calling run; download it by this id
        value: ${{ jobs.windows.outputs.package-artifact-id }}
      package-artifact-digest:
        description: The SHA-256 digest of that artifact as it was uploaded
        value: ${{ jobs.windows.outputs.package-artifact-digest }}
      package-sha256:
        description: The SHA-256 of rpa-windows-x64.zip as the stage step computed it; compare the downloaded zip with this
        value: ${{ jobs.windows.outputs.package-sha256 }}

permissions: {}

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: desktop/global.json
      - name: Build everything (the Windows projects compile on Linux)
        timeout-minutes: 10
        run: dotnet build desktop/Rpa.Desktop.sln -c Release
      - name: Core unit tests
        timeout-minutes: 10
        run: dotnet test desktop/runner/test/Rpa.Runner.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Supervisor core unit tests
        timeout-minutes: 10
        run: dotnet test desktop/runner/test/Rpa.Supervisor.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Recorder core unit tests
        timeout-minutes: 10
        run: dotnet test desktop/recorder/test/Rpa.Recorder.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      # The name the step "Upload the Windows package" uses, the id and digest that step reports, and the zip's
      # SHA-256 from the step "Stage the Windows package".
      package-artifact: rpa-windows-package
      package-artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
      package-artifact-digest: ${{ steps.upload-package.outputs.artifact-digest }}
      package-sha256: ${{ steps.stage.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh
    env:
      OUT: ${{ github.workspace }}\out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: desktop/global.json

      - name: Build
        timeout-minutes: 10
        run: dotnet build desktop/Rpa.Desktop.sln -c Release

      # The spike: can UI Automation (the OS's own client, not our code) see a WinForms window on this runner? If this
      # fails, the hosted runner has no usable desktop and nothing after it can work.
      - name: UI Automation spike (Windows PowerShell's UIAutomationClient sees the ERP Demo sign-in window)
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $exe = Join-Path $env:GITHUB_WORKSPACE 'desktop\erp-demo\bin\Release\net8.0-windows\ErpDemo.exe'
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
            $win = $null
            for ($i = 0; $i -lt 60 -and -not $win; $i++) { Start-Sleep -Milliseconds 500; $win = $root.FindFirst('Children', $cond) }
            if (-not $win) { throw "UI Automation found no window of ErpDemo.exe (pid $($p.Id))" }
            $user = $win.FindFirst('Descendants', (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'txtUser')))
            Write-Host "window: '$($win.Current.Name)' class=$($win.Current.ClassName); txtUser found: $($null -ne $user)"
            Write-Host "session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive: $([Environment]::UserInteractive), user: $env:USERNAME"
            if (-not $user) { throw 'the window has no txtUser element' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Core unit tests (Windows)
        timeout-minutes: 10
        run: |
          dotnet test desktop/runner/test/Rpa.Runner.Core.Tests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test desktop/runner/test/Rpa.Supervisor.Core.Tests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test desktop/recorder/test/Rpa.Recorder.Core.Tests -c Release --no-build

      - name: Publish the runner, the supervisor, the policy tool, the recorder and the demo app (self-contained win-x64, single file)
        timeout-minutes: 10
        run: |
          # The runner, the supervisor and the policy tool are published without IncludeNativeLibrariesForSelfExtract:
          # with it, a single file unpacks native libraries to the temp folder of whoever starts it, at every start, and
          # loads them from there. Without it they stay beside the program, and Stage.ps1 copies them into the package.
          # The supervisor goes into the runner's folder, where Stage.ps1 takes it from; the two bring the same
          # libraries of the same runtime.
          $single = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true', '-p:PublishSingleFile=true')
          dotnet publish desktop/runner/src/Rpa.Runner @single '-p:EnableCompressionInSingleFile=true' -o "$env:OUT\rpa-desktop-runner"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish desktop/runner/src/Rpa.Supervisor @single '-p:EnableCompressionInSingleFile=true' -o "$env:OUT\rpa-desktop-runner"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item desktop/runner/policy.example.json, desktop/README.md "$env:OUT\rpa-desktop-runner\"
          # The policy tool is published on Windows: its manifest, which asks for administrator rights, is embedded
          # only there.
          dotnet publish desktop/runner/src/Rpa.Runner.PolicyTool @single -o "$env:OUT\rpa-policy-tool"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish desktop/recorder/src/Rpa.Recorder @single '-p:EnableCompressionInSingleFile=true' -o "$env:OUT\rpa-recorder"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The recorder scenario's own build, with --headless (recording without the bar). The package gets the build
          # above, which refuses it.
          dotnet publish desktop/recorder/src/Rpa.Recorder @single '-p:EnableCompressionInSingleFile=true' '-p:RecorderScenario=true' -o "$env:OUT\rpa-recorder-scenario"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($ui in 'v1', 'v2') {
            dotnet publish desktop/erp-demo @single '-p:IncludeNativeLibrariesForSelfExtract=true' '-p:EnableCompressionInSingleFile=true' "-p:ErpDemoUi=$ui" -o "$env:OUT\erp-demo\$ui"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-ChildItem -Recurse $env:OUT -Include *.exe, *.dll | ForEach-Object { '{0} {1:N1} MB' -f $_.FullName, ($_.Length / 1MB) }

      # One step for the runner and the client: the step starts the runner, runs the scenario against it and ends the
      # runner in its finally block (a process a step starts goes on running after the step otherwise). The policy
      # sits at the contract's default location; the token is fresh, random and masked. allowUserWritable: the
      # workspace belongs to the runner's own (admin) user, which a real install must avoid.
      - name: Start the runner and run the protocol scenario (drives the ERP Demo through the runner)
        timeout-minutes: 12
        run: |
          $data = Join-Path $env:ProgramData 'RPA Runner'
          New-Item -ItemType Directory -Force $data, "$env:OUT\logs" | Out-Null
          $v1 = "$env:OUT\erp-demo\v1\ErpDemo.exe"
          $v2 = "$env:OUT\erp-demo\v2\ErpDemo.exe"
          @{
            allowedApps   = @(@{ exe = 'ErpDemo.exe'; path = $v1; allowUserWritable = $true },
                              @{ exe = 'ErpDemo.exe'; path = $v2; allowUserWritable = $true })
            writeControls = @(@{ exe = 'ErpDemo.exe'; automationId = 'btnPost' })
            gatedKeys     = @('Ctrl+S', 'F11')
            maxFileBytes  = 20971520
            helperProcesses = @(@{ exe = 'msedgewebview2.exe'; pathPattern = 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' })
            clipboardRead = $true
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $data 'policy.json')
          $bytes = [byte[]]::new(32); [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $env:RPA_RUNNER_TOKEN = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+', '-').Replace('/', '_')
          Write-Host "::add-mask::$env:RPA_RUNNER_TOKEN"
          $p = Start-Process -FilePath "$env:OUT\rpa-desktop-runner\RpaRunner.exe" -WindowStyle Hidden -PassThru `
                 -RedirectStandardOutput "$env:OUT\logs\runner-stdout.log" -RedirectStandardError "$env:OUT\logs\runner-stderr.log"
          try {
            $line = $null
            for ($i = 0; $i -lt 60 -and -not $line -and -not $p.HasExited; $i++) {
              Start-Sleep -Milliseconds 500
              $line = Get-Content "$env:OUT\logs\runner-stdout.log" -ErrorAction SilentlyContinue | Select-String 'RPA runner listening on' | Select-Object -First 1
            }
            Get-Content "$env:OUT\logs\runner-stdout.log", "$env:OUT\logs\runner-stderr.log" -ErrorAction SilentlyContinue
            if (-not $line) { throw 'the runner did not start' }
            if ($line.Line -notmatch 'listening on wss://0\.0\.0\.0:8765/rpa/v1, fingerprint ((?:[0-9A-F]{2}:){31}[0-9A-F]{2})$') { throw "unexpected start line: $($line.Line)" }
            dotnet desktop/runner/test/Rpa.Runner.Scenario/bin/Release/net8.0/Rpa.Runner.Scenario.dll `
              --url wss://127.0.0.1:8765/rpa/v1 --fingerprint $Matches[1] `
              --app $v1 --app-v2 $v2 --out "$env:OUT\scenario"
            $code = $LASTEXITCODE
            if ($p.HasExited) { Write-Host "::error::the runner exited during the scenario (code $($p.ExitCode))"; $code = 1 }
            exit $code
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # The recorder records the reference flow that a stand-in for a person performs with synthetic input (the same
      # ERP Demo build, then with --ui v2), and the scenario checks the recording against the engine's golden file.
      # continue-on-error: low-level hooks and synthetic input together have not been seen on a hosted runner yet, and a
      # failure here must not keep the package from being uploaded. Its result shows on the step; the check is made on
      # a real Windows Server in any case.
      - name: Record the ERP Demo flow with RpaRecorder (the recorder scenario)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          dotnet desktop/recorder/test/Rpa.Recorder.Scenario/bin/Release/net8.0-windows/Rpa.Recorder.Scenario.dll `
            --recorder "$env:OUT\rpa-recorder-scenario\RpaRecorder.exe" --app "$env:OUT\erp-demo\v1\ErpDemo.exe" `
            --golden packages/engine/test/fixtures/import/recording-erp/erp.rpa-recording.json --out "$env:OUT\recorder-scenario"
          exit $LASTEXITCODE

      - name: Collect the runner's logs
        if: always()
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\logs" | Out-Null
          Copy-Item (Join-Path $env:ProgramData 'RPA Runner\logs\*') "$env:OUT\logs\" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\logs" -ErrorAction SilentlyContinue

      - name: Show the runner log and the snapshots (failure)
        if: failure()
        timeout-minutes: 2
        run: |
          Get-Content "$env:OUT\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 300
          Get-ChildItem "$env:OUT\scenario\*.json" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_ | Select-Object -First 400 }

      - name: Upload logs, snapshots and screenshots (failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-scenario-logs
          path: |
            out/logs
            out/scenario
          retention-days: 14
          if-no-files-found: ignore

      # ---- The Windows package: the installer's own tests, then the package is staged, installed and driven. ----
      # Windows PowerShell 5.1 (shell: powershell) runs the installer, the uninstaller and their tests: it is the
      # PowerShell the installer is written for.
      - name: Installer tests (Pester, Windows PowerShell 5.1)
        timeout-minutes: 10
        shell: powershell
        run: |
          # The Windows-only tests run the installer from a temporary folder, and the installer refuses a package in
          # a folder other users could change. So the tests get a temporary folder only administrators can change.
          New-Item -ItemType Directory -Force C:\rpa-ci\temp | Out-Null
          & "$env:SystemRoot\System32\icacls.exe" C:\rpa-ci /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE) { throw 'icacls failed' }
          $env:TEMP = 'C:\rpa-ci\temp'; $env:TMP = 'C:\rpa-ci\temp'
          Import-Module Pester -MinimumVersion 5.0
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion), Pester $((Get-Module Pester).Version)"
          Invoke-Pester desktop/installer/test -CI

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # Quoted globs: Node 22 does not run a folder given to --test.
      - name: Browser host and gate tests (the Node version the package ships)
        timeout-minutes: 5
        run: node --test "images/browser/host/test/*.test.js" "images/browser/gate/test/*.test.js"

      # Downloads Node (checked against the SHA-256 in the script), Playwright (npm ci, checked against the lockfile)
      # and Chromium (Playwright's installer; the list of its files checked against the SHA-256 in the script). The
      # zip's SHA-256 is an output of this step and of the workflow (package-sha256).
      - name: Stage the Windows package
        id: stage
        timeout-minutes: 15
        shell: powershell
        run: |
          & desktop\installer\build\Stage.ps1 -Out "$env:OUT\package" -RunnerDir "$env:OUT\rpa-desktop-runner" -PolicyToolDir "$env:OUT\rpa-policy-tool" -RecorderDir "$env:OUT\rpa-recorder" -ErpDemoDir "$env:OUT\erp-demo"
          $zip = "$env:OUT\package\rpa-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ([IO.File]::ReadAllText("$zip.sha256") -ne "$hash  rpa-windows-x64.zip") { throw "rpa-windows-x64.zip.sha256 does not name the zip's SHA-256 $hash" }
          if ([IO.File]::ReadAllText("$env:OUT\package\Get-Rpa.ps1") -notmatch "(?m)^\`$PackageSha256 = '$hash'\r?`$") { throw "Get-Rpa.ps1 does not name the zip's SHA-256 $hash" }
          "rpa-windows-x64.zip SHA-256 $hash"
          "sha256=$hash" | Out-File -Append -Encoding ascii -LiteralPath $env:GITHUB_OUTPUT

      # The account of this job is an administrator, so it cannot be the bot user: the installer creates a standard
      # local user, with a random password that is made here and never printed. The package is unpacked where only
      # administrators can change it. 127.0.0.1 stands for the n8n host.
      - name: Install the package (a first install for a new standard user)
        timeout-minutes: 10
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $data = Join-Path $env:ProgramData 'RPA Runner'
          # What the first scenario left at the default location: the installer starts from a machine without it.
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          # The installer refuses a package in a folder that other users could change.
          New-Item -ItemType Directory -Force C:\rpa-ci\package | Out-Null
          & "$env:SystemRoot\System32\icacls.exe" C:\rpa-ci /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE) { throw 'icacls failed' }
          Expand-Archive -LiteralPath "$env:OUT\package\rpa-windows-x64.zip" -DestinationPath C:\rpa-ci\package
          $package = 'C:\rpa-ci\package\rpa-windows-x64'

          $bytes = New-Object byte[] 24
          $random = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $random.GetBytes($bytes) } finally { $random.Dispose() }
          $password = New-Object Security.SecureString
          foreach ($char in ('Aa1-' + [Convert]::ToBase64String($bytes)).ToCharArray()) { $password.AppendChar($char) }
          $password.MakeReadOnly()

          $global:LASTEXITCODE = 0
          & "$package\Install-Rpa.ps1" -User rpa-ci-bot -UserPassword $password -AllowFrom 127.0.0.1 -Force
          Assert ($LASTEXITCODE -eq 0) "Install-Rpa.ps1 exits 0 (it was $LASTEXITCODE)"

          $bot = (New-Object Security.Principal.NTAccount("$env:COMPUTERNAME\rpa-ci-bot")).Translate([Security.Principal.SecurityIdentifier]).Value
          $groups = @(([ADSI]"WinNT://$env:COMPUTERNAME/rpa-ci-bot,user").Groups() | ForEach-Object { $_.GetType().InvokeMember('Name', 'GetProperty', $null, $_, $null) })
          $users = ((New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-545').Translate([Security.Principal.NTAccount]).Value -split '\\')[-1]
          Assert (($groups -join ',') -eq $users) "rpa-ci-bot is a standard user: a member of $users and of no other local group ($($groups -join ','))"

          foreach ($name in 'RPA Runner', 'RPA Browser') {
            $task = Get-ScheduledTask -TaskPath '\RPA\' -TaskName $name
            Assert ($task.Principal.UserId -eq 'rpa-ci-bot' -and $task.Principal.LogonType -eq 'Interactive' -and $task.Principal.RunLevel -eq 'Limited') "task $name runs as rpa-ci-bot, in its session, not elevated"
            $trigger = @($task.Triggers)
            Assert ($trigger.Count -eq 1 -and $trigger[0].CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' -and $trigger[0].UserId -eq "$env:COMPUTERNAME\rpa-ci-bot") "task $name starts when rpa-ci-bot signs in"
          }
          foreach ($rule in @{ Name = 'RPA-Runner-In'; Port = '8765'; Program = "$install\runner\RpaRunner.exe" }, @{ Name = 'RPA-Browser-In'; Port = '3000'; Program = "$install\browser\node.exe" }) {
            $found = Get-NetFirewallRule -Name $rule.Name
            Assert ($found.Enabled -eq 'True' -and $found.Direction -eq 'Inbound' -and $found.Action -eq 'Allow') "firewall rule $($rule.Name) lets connections in"
            Assert (($found | Get-NetFirewallApplicationFilter).Program -eq $rule.Program) "firewall rule $($rule.Name) is for $($rule.Program)"
            $addresses = @(($found | Get-NetFirewallAddressFilter).RemoteAddress) -join ','
            $ports = @(($found | Get-NetFirewallPortFilter).LocalPort) -join ','
            Assert ($addresses -eq '127.0.0.1' -and $ports -eq $rule.Port) "firewall rule $($rule.Name) is for port $($rule.Port) from 127.0.0.1 only (ports $ports, addresses $addresses)"
          }

          # The browser files as installed are the files Stage.ps1 listed in browser\ms-playwright.sha256 and checked
          # against the SHA-256 in the script: no file more or less, and each with the listed SHA-256.
          $listFile = "$install\browser\ms-playwright.sha256"
          Assert ((Get-FileHash -LiteralPath $listFile).Hash -eq (Get-FileHash -LiteralPath "$package\browser\ms-playwright.sha256").Hash) 'the installed browser\ms-playwright.sha256 is the one in the package'
          $listed = @{}
          foreach ($line in [IO.File]::ReadAllLines($listFile)) {
            if ($line -notmatch '^([0-9a-f]{64})  (\S.*)$') { throw "FAILED: browser\ms-playwright.sha256 holds the line '$line'" }
            $listed[$Matches[2]] = $Matches[1]
          }
          $root = "$install\browser\ms-playwright"
          $present = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') })
          $differ = @($present | Where-Object { -not $listed.ContainsKey($_) -or (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root $_)).Hash.ToLowerInvariant() -ne $listed[$_] })
          Assert ($listed.Count -gt 0 -and $present.Count -eq $listed.Count -and $differ.Count -eq 0) "the $($present.Count) installed browser files are the $($listed.Count) files of browser\ms-playwright.sha256, each with its SHA-256 ($($differ.Count) not listed or different: $(($differ | Select-Object -First 5) -join ', '))"

          # Who may do what with the files the bot user must not change: the owner is Administrators, nothing is
          # inherited, nobody but SYSTEM and Administrators may write, and the bot user may read.
          $administrators = 'S-1-5-18', 'S-1-5-32-544'
          # Write or append data, write attributes, delete, delete what is inside, change the rules, take ownership.
          $write = 0x2 -bor 0x4 -bor 0x10 -bor 0x40 -bor 0x100 -bor 0x10000 -bor 0x40000 -bor 0x80000
          foreach ($name in 'policy.json', 'token', 'browser-token') {
            $acl = Get-Acl -LiteralPath (Join-Path $data $name)
            $rules = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            Assert ($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-544' -and $acl.AreAccessRulesProtected) "$name is owned by Administrators and inherits no rule"
            $writers = @($rules | Where-Object { $_.AccessControlType -eq 'Allow' -and $administrators -notcontains $_.IdentityReference.Value -and ([int]$_.FileSystemRights -band $write) })
            Assert ($writers.Count -eq 0) "no rule of $name lets anyone but SYSTEM and Administrators write"
            $readers = @($rules | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.IdentityReference.Value -eq $bot -and ([int]$_.FileSystemRights -band 0x1) })
            Assert ($readers.Count -eq 1) "rpa-ci-bot may read $name"
          }
          $acl = Get-Acl -LiteralPath (Join-Path $data 'policy-backups')
          $others = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object { $administrators -notcontains $_.IdentityReference.Value })
          Assert ($acl.AreAccessRulesProtected -and $others.Count -eq 0 -and $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-544') 'policy-backups is there, and only SYSTEM and Administrators have access'

          $record = Get-Content -Raw -LiteralPath "$install\install.json" -Encoding UTF8 | ConvertFrom-Json
          $version = (Get-Content -LiteralPath "$package\VERSION" -TotalCount 1).Trim()
          Assert ($record.version -eq $version -and $record.user -eq 'rpa-ci-bot' -and $record.runnerPort -eq 8765 -and $record.browserPort -eq 3000) "install.json records version $version, the user and the ports"
          Assert ($record.browser -eq $true -and $record.autoSignIn -eq $false -and (@($record.allowFrom) -join ',') -eq '127.0.0.1' -and $record.publicNetwork -eq $true -and @($record.signInChanges).Count -eq 0) 'install.json records the browser, no automatic sign-in and who may connect'
          Assert ((Get-Content -Raw -LiteralPath "$data\policy.json") -match '"allowedApps":\s*\[\s*\]') 'the new policy allows no app'

      # The policy tool honours --yes only when every other process attached to its console is elevated; the shell of
      # this step is. The letter n on its input would decline if the tool asked after all.
      # ci-policy-change.json is for this hosted machine only. No bot user signs in here, so the runner runs as this
      # job's account, an administrator, who can change the installed demo apps: hence allowUserWritable for both.
      # On a real machine the change leaves allowUserWritable out: the runner runs as the bot user, a standard user,
      # and the access rules of Program Files give standard users read and run there, not write.
      - name: Change the policy with the installed RpaPolicy.exe
        timeout-minutes: 5
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $data = Join-Path $env:ProgramData 'RPA Runner'
          $tool = Join-Path $env:ProgramFiles 'RPA Runner\runner\RpaPolicy.exe'
          $policy = Join-Path $data 'policy.json'

          # The manifest embedded in the published program (resource type 24, id 1), read through Windows itself.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class EmbeddedManifest {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode)] static extern IntPtr LoadLibraryEx(string file, IntPtr reserved, uint flags);
            [DllImport("kernel32.dll")] static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
            [DllImport("kernel32.dll")] static extern IntPtr LoadResource(IntPtr module, IntPtr resource);
            [DllImport("kernel32.dll")] static extern uint SizeofResource(IntPtr module, IntPtr resource);
            [DllImport("kernel32.dll")] static extern IntPtr LockResource(IntPtr data);
            [DllImport("kernel32.dll")] static extern bool FreeLibrary(IntPtr module);
            public static string Read(string file) {
              IntPtr module = LoadLibraryEx(file, IntPtr.Zero, 0x2 | 0x20);
              if (module == IntPtr.Zero) return "";
              try {
                IntPtr resource = FindResource(module, (IntPtr)1, (IntPtr)24);
                if (resource == IntPtr.Zero) return "";
                byte[] bytes = new byte[SizeofResource(module, resource)];
                Marshal.Copy(LockResource(LoadResource(module, resource)), bytes, 0, bytes.Length);
                return System.Text.Encoding.UTF8.GetString(bytes);
              } finally { FreeLibrary(module); }
            }
          }
          '@
          Assert ([EmbeddedManifest]::Read($tool) -match '<requestedExecutionLevel[^>]*level="requireAdministrator"') 'RpaPolicy.exe asks for administrator rights (its embedded manifest)'

          function Get-Rules([string]$path) {
            $acl = Get-Acl -LiteralPath $path
            $rules = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | ForEach-Object { '{0}:{1}:{2}:{3}' -f $_.AccessControlType, $_.IdentityReference.Value, [int]$_.FileSystemRights, $_.IsInherited } | Sort-Object)
            'owner {0}; protected {1}; {2}' -f $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value, $acl.AreAccessRulesProtected, ($rules -join ' ')
          }
          $before = Get-Rules $policy
          # Published without IncludeNativeLibrariesForSelfExtract, the elevated tool unpacks nothing to the temp
          # folder of whoever starts it (a single file with it unpacks to <temp>\.net\RpaPolicy and loads from there).
          $unpacked = Join-Path ([IO.Path]::GetTempPath()) '.net\RpaPolicy'
          Assert (-not $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -and -not (Test-Path -LiteralPath $unpacked)) "before the policy tool runs: no DOTNET_BUNDLE_EXTRACT_BASE_DIR, no $unpacked"
          $output = @('n' | & $tool apply (Join-Path $env:GITHUB_WORKSPACE 'desktop\installer\test\ci-policy-change.json') --yes)
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host "  | $_" }
          Assert (-not (Test-Path -LiteralPath $unpacked)) "RpaPolicy.exe unpacked nothing: there is no $unpacked"
          Assert ($code -eq 0 -and $output -contains 'Policy updated. The runner restarts within 10 seconds and uses the new policy.') "RpaPolicy.exe apply --yes exits 0 and says that the policy is updated (exit code $code)"
          Assert (($output -join "`n") -notmatch '--yes is ignored|Apply these changes') 'the tool honoured --yes and did not ask'

          Assert ((Get-Rules $policy) -eq $before -and $before.StartsWith('owner S-1-5-32-544; protected True;')) 'policy.json has the owner and the access rules it had before (owner Administrators, nothing inherited)'
          $bot = (New-Object Security.Principal.NTAccount("$env:COMPUTERNAME\rpa-ci-bot")).Translate([Security.Principal.SecurityIdentifier]).Value
          Assert ($before -match "Allow:${bot}:\d+:False") 'the rule that lets rpa-ci-bot read policy.json is still there'
          Assert (@(Get-ChildItem -LiteralPath $data -Filter 'policy.json.*.tmp' -Force).Count -eq 0) 'no policy.json.*.tmp is left'
          $backups = @(Get-ChildItem -LiteralPath (Join-Path $data 'policy-backups') -Filter 'policy.json.*.bak')
          Assert ($backups.Count -eq 1 -and (Get-Content -Raw -LiteralPath $backups[0].FullName) -match '"allowedApps":\s*\[\s*\]') 'policy-backups holds the policy as it was before'
          $new = Get-Content -Raw -LiteralPath $policy | ConvertFrom-Json
          Assert (@($new.allowedApps).Count -eq 2 -and @($new.writeControls).Count -eq 1 -and @($new.gatedKeys).Count -eq 2 -and $new.clipboardRead -eq $true) 'policy.json holds the two demo apps, the write control, the gated keys and clipboard read'

      # The logon tasks do not start on this machine: nobody signs in as rpa-ci-bot. The two start scripts are
      # started by hand, as the account of this job (an administrator, which the access rules let read the tokens),
      # in this job's desktop session. That is for this hosted machine only: on a real machine nobody starts them from
      # an elevated shell; the logon tasks start both programs in the bot user's session when it signs in. The
      # programs go on running after this step: the upgrade and the uninstall below find them running and stop them,
      # as on a machine in use.
      - name: Start the installed runner and browser and drive them (protocol scenario, browser smoke)
        timeout-minutes: 15
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $data = Join-Path $env:ProgramData 'RPA Runner'
          $powershell = Join-Path $PSHOME 'powershell.exe'
          foreach ($name in 'token', 'browser-token') { Write-Host "::add-mask::$(([IO.File]::ReadAllText((Join-Path $data $name))).Trim())" }

          foreach ($script in 'start-runner.ps1', 'start-browser.ps1') {
            Start-Process -FilePath $powershell -WindowStyle Hidden -ArgumentList ('-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"' -f (Join-Path $install "scripts\$script"))
          }
          $runnerLine = $null; $browserLine = $null
          for ($i = 0; $i -lt 240 -and -not ($runnerLine -and $browserLine); $i++) {
            Start-Sleep -Milliseconds 500
            $runnerLine = Get-Content "$data\logs\runner.out.log" -ErrorAction SilentlyContinue | Select-String 'RPA runner listening on wss://0\.0\.0\.0:8765/rpa/v1, fingerprint (?:[0-9A-F]{2}:){31}[0-9A-F]{2}$' | Select-Object -First 1
            $browserLine = Get-Content "$data\logs\browser.out.log" -ErrorAction SilentlyContinue | Select-String '^RPA browser listening on wss://0\.0\.0\.0:3000, fingerprint (?:[0-9A-F]{2}:){31}[0-9A-F]{2}$' | Select-Object -First 1
          }
          Get-Content "$data\logs\start-runner.log", "$data\logs\runner.out.log", "$data\logs\runner.err.log", "$data\logs\start-browser.log", "$data\logs\browser.out.log", "$data\logs\browser.err.log" -ErrorAction SilentlyContinue
          Assert ([bool]$runnerLine) "the runner's start line is in runner.out.log"
          Assert ([bool]$browserLine) "the browser host's start line is in browser.out.log"
          Assert ([bool](Get-Content "$data\logs\runner.out.log" | Select-String 'policy loaded: 2 allowed app\(s\), 1 write control\(s\), 2 gated key\(s\)')) 'the runner started with the changed policy'
          $unpacked = Join-Path ([IO.Path]::GetTempPath()) '.net\RpaRunner'
          Assert (-not $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -and -not (Test-Path -LiteralPath $unpacked)) "the runner unpacked nothing: there is no $unpacked"

          $shown = @(& $powershell -NoProfile -ExecutionPolicy Bypass -File "$install\scripts\Show-RpaConnection.ps1")
          $shown | ForEach-Object { Write-Host "  | $_" }
          $runner = @($shown | Where-Object { $_ -match '^Runner fingerprint: ((?:[0-9A-F]{2}:){31}[0-9A-F]{2})$' } | ForEach-Object { $Matches[1] })
          $browser = @($shown | Where-Object { $_ -match '^Browser fingerprint: ((?:[0-9A-F]{2}:){31}[0-9A-F]{2})$' } | ForEach-Object { $Matches[1] })
          Assert ($runner.Count -eq 1 -and $browser.Count -eq 1) 'Show-RpaConnection.ps1 prints two fingerprints of 32 hex pairs'
          Assert ($runnerLine.Line.EndsWith($runner[0]) -and $browserLine.Line.EndsWith($browser[0])) 'they are the fingerprints of the two start lines'
          $text = $shown -join "`n"
          foreach ($name in 'token', 'browser-token') { Assert (-not $text.Contains(([IO.File]::ReadAllText((Join-Path $data $name))).Trim())) "the output of Show-RpaConnection.ps1 does not hold what is in $name" }
          Assert ($text -notmatch 'not listening') 'both programs are listening'

          # The scenario of the step above, now against the installed runner, the installed demo apps and the policy
          # the policy tool wrote.
          $env:RPA_RUNNER_TOKEN = ([IO.File]::ReadAllText((Join-Path $data 'token'))).Trim()
          dotnet desktop/runner/test/Rpa.Runner.Scenario/bin/Release/net8.0/Rpa.Runner.Scenario.dll `
            --url wss://127.0.0.1:8765/rpa/v1 --fingerprint $runner[0] `
            --app "$install\erp-demo\v1\ErpDemo.exe" --app-v2 "$install\erp-demo\v2\ErpDemo.exe" --out "$env:OUT\install-scenario"
          $code = $LASTEXITCODE
          $env:RPA_RUNNER_TOKEN = $null
          Assert ($code -eq 0) "the protocol scenario passes against the installed runner (exit code $code)"

          # The browser: through the fingerprint-checking tunnel, without launch options (the host opens it with a window).
          # While the page is held open, what this desktop shows of it is written to the log.
          $smoke = Start-Process -FilePath "$install\browser\node.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:OUT\logs\browser-smoke.log" -RedirectStandardError "$env:OUT\logs\browser-smoke.err.log" `
            -ArgumentList ('"{0}" --fingerprint {1} --hold-ms 8000' -f (Join-Path $env:GITHUB_WORKSPACE 'desktop\installer\test\browser-smoke.mjs'), $browser[0])
          $null = $smoke.Handle
          for ($i = 0; $i -lt 400 -and -not $smoke.HasExited -and -not (Get-Content "$env:OUT\logs\browser-smoke.log" -ErrorAction SilentlyContinue | Select-String 'holding the page open'); $i++) { Start-Sleep -Milliseconds 300 }
          $chrome = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object { $_.ExecutablePath -like "$install\*" })
          $unreadable = @($chrome | Where-Object { -not $_.CommandLine })
          $sandboxless = @($chrome | Where-Object { $_.CommandLine -match '--no-sandbox' })
          Write-Host "while the page is open: $($chrome.Count) chrome.exe processes from the install, in session $(($chrome | ForEach-Object { $_.SessionId } | Sort-Object -Unique) -join ','); command line not readable: $($unreadable.Count); with --no-sandbox: $($sandboxless.Count)"
          Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | ForEach-Object { Write-Host "  chrome.exe $($_.Id) has a window titled '$($_.MainWindowTitle)'" }
          $smoke.WaitForExit(120000) | Out-Null
          Get-Content "$env:OUT\logs\browser-smoke.log", "$env:OUT\logs\browser-smoke.err.log" -ErrorAction SilentlyContinue
          Assert ($smoke.HasExited -and $smoke.ExitCode -eq 0) 'the browser smoke test passes'
          Assert ($chrome.Count -gt 0 -and $unreadable.Count -eq 0 -and $sandboxless.Count -eq 0) 'the browser ran from the install; each of its processes has a readable command line, none with --no-sandbox'

      # Running the installer again upgrades: the running programs are stopped (-Force: the runner is running) and
      # replaced; the tokens, the policy and the certificates stay, and an upgrade without firewall parameters keeps
      # who may connect.
      - name: Upgrade (the installer run again)
        timeout-minutes: 10
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $data = Join-Path $env:ProgramData 'RPA Runner'
          $powershell = Join-Path $PSHOME 'powershell.exe'
          # The SHA-256 of the two tokens and the policy, the two fingerprints, and who may connect.
          function Get-State {
            $state = [ordered]@{}
            foreach ($name in 'token', 'browser-token', 'policy.json') { $state[$name] = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $data $name)).Hash }
            foreach ($line in @(& $powershell -NoProfile -ExecutionPolicy Bypass -File "$install\scripts\Show-RpaConnection.ps1")) { if ($line -match '^(Runner|Browser) fingerprint: ((?:[0-9A-F]{2}:){31}[0-9A-F]{2})$') { $state[$Matches[1]] = $Matches[2] } }
            $state['allowFrom'] = @((Get-Content -Raw -LiteralPath "$install\install.json" | ConvertFrom-Json).allowFrom) -join ','
            $state['firewall'] = @(Get-NetFirewallRule -Name 'RPA-Runner-In', 'RPA-Browser-In' | ForEach-Object { ($_ | Get-NetFirewallAddressFilter).RemoteAddress }) -join ','
            $state
          }
          $before = Get-State
          Assert ($before.Count -eq 7 -and $before['firewall'] -eq '127.0.0.1,127.0.0.1') 'before the upgrade: two tokens, the policy, two fingerprints, and rules for 127.0.0.1'

          $global:LASTEXITCODE = 0
          & 'C:\rpa-ci\package\rpa-windows-x64\Install-Rpa.ps1' -User rpa-ci-bot -Force
          Assert ($LASTEXITCODE -eq 0) "Install-Rpa.ps1 exits 0 on the upgrade (it was $LASTEXITCODE)"

          # Both programs once more, so that the fingerprints are those of a start after the upgrade. A start script
          # notes each start in start-<name>.log and keeps the output of the run before in <name>.out.1.log.
          function Get-Starts([string]$name) { @(Get-Content "$data\logs\start-$name.log" -ErrorAction SilentlyContinue | Select-String ' starting C:').Count }
          function Test-Listening([string]$name) { [bool](Get-Content "$data\logs\$name.out.log" -ErrorAction SilentlyContinue | Select-String "RPA $name listening on") }
          $starts = @{ runner = Get-Starts 'runner'; browser = Get-Starts 'browser' }
          foreach ($script in 'start-runner.ps1', 'start-browser.ps1') {
            Start-Process -FilePath $powershell -WindowStyle Hidden -ArgumentList ('-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"' -f (Join-Path $install "scripts\$script"))
          }
          $started = $false
          for ($i = 0; $i -lt 240 -and -not $started; $i++) {
            Start-Sleep -Milliseconds 500
            $started = (Get-Starts 'runner') -gt $starts.runner -and (Get-Starts 'browser') -gt $starts.browser -and (Test-Listening 'runner') -and (Test-Listening 'browser')
          }
          Assert $started 'both programs start again after the upgrade'
          $after = Get-State
          foreach ($name in $before.Keys) { Assert ($after[$name] -eq $before[$name]) "unchanged by the upgrade: $name" }

      # Uninstall keeps the data directory; -RemoveData, run from the unpacked package afterwards, removes it.
      # -RemoveData is refused while a process is running of an account that owns something in the data directory.
      # On an installed machine that is the bot user, which is signed out first. Here the runner ran as this job's
      # account, so that account owns what the runner made there (its exports folder): the refusal is checked, what
      # this job's account owns is removed, and then the data directory goes.
      - name: Uninstall, then remove the data
        timeout-minutes: 10
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $data = Join-Path $env:ProgramData 'RPA Runner'
          New-Item -ItemType Directory -Force "$env:OUT\install-logs" | Out-Null
          Copy-Item "$data\logs\*" "$env:OUT\install-logs\" -ErrorAction SilentlyContinue

          $global:LASTEXITCODE = 0
          & "$install\Uninstall-Rpa.ps1"
          Assert ($LASTEXITCODE -eq 0) "Uninstall-Rpa.ps1 exits 0 (it was $LASTEXITCODE)"
          Assert (@(Get-ScheduledTask -TaskPath '\RPA\' -ErrorAction SilentlyContinue).Count -eq 0) 'the two tasks are gone'
          Assert (@(Get-NetFirewallRule -Name 'RPA-*' -ErrorAction SilentlyContinue).Count -eq 0) 'the two firewall rules are gone'
          Assert (-not (Test-Path -LiteralPath $install)) 'the install directory is gone'
          Assert ((Test-Path -LiteralPath "$data\policy.json") -and (Test-Path -LiteralPath "$data\token") -and (Test-Path -LiteralPath "$data\browser-token")) 'the data directory is kept, with the policy and the tokens'
          Assert ([bool](Get-LocalUser -Name rpa-ci-bot -ErrorAction SilentlyContinue)) 'the Windows user is kept'

          $uninstaller = 'C:\rpa-ci\package\rpa-windows-x64\Uninstall-Rpa.ps1'
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $mine = @()
          if ('S-1-5-18', 'S-1-5-32-544' -notcontains $me.Value) {
            $mine = @(Get-ChildItem -LiteralPath $data -Force | Where-Object { (Get-Acl -LiteralPath $_.FullName).GetOwner([Security.Principal.SecurityIdentifier]) -eq $me })
          }
          if ($mine.Count -gt 0) {
            Write-Host "owned by this job's account: $(($mine | ForEach-Object { $_.Name }) -join ', ')"
            $refused = @(& (Join-Path $PSHOME 'powershell.exe') -NoProfile -ExecutionPolicy Bypass -File $uninstaller -RemoveData)
            $code = $LASTEXITCODE
            $refused | ForEach-Object { Write-Host "  | $_" }
            Assert ($code -eq 1 -and ($refused -join "`n") -match ' is signed in\. Sign .+ out, then run Uninstall-Rpa\.ps1 -RemoveData again\.' -and $refused -contains 'Nothing was changed.') '-RemoveData is refused while the account that owns something in the data directory has a process running'
            Assert ((Test-Path -LiteralPath "$data\policy.json") -and (Test-Path -LiteralPath "$data\token")) 'the refusal removed nothing'
            $mine | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          }
          $global:LASTEXITCODE = 0
          & $uninstaller -RemoveData
          Assert ($LASTEXITCODE -eq 0) "Uninstall-Rpa.ps1 -RemoveData, from the unpacked package, exits 0 (it was $LASTEXITCODE)"
          Assert (-not (Test-Path -LiteralPath $data)) 'the data directory is gone'

      # -Unattended, for another new user: the installer makes its random password, which is stored only for the RPA
      # Supervisor and printed nowhere. The service listens on the public ports in place of the runner and the browser
      # and signs the bot user in through a Remote Desktop connection from this machine to itself; the installer signs
      # it in once (the first sign-in makes the profile). This step checks what the install changed and that the
      # service runs. Whether a hosted runner allows the loopback Remote Desktop sign-in is only known from a run: the
      # next step checks the sign-in itself, and if a hosted runner refuses it, that check is left to a run on a real
      # Windows Server.
      - name: Install with -Unattended (the service RPA Supervisor)
        timeout-minutes: 10
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $data = Join-Path $env:ProgramData 'RPA Runner'
          # What the uninstall must put back: Remote Desktop as found, and the Remote Desktop firewall rules untouched.
          $terminal = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $deny = (Get-ItemProperty -LiteralPath $terminal -Name fDenyTSConnections).fDenyTSConnections
          $rdpRules = (@(Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue | ForEach-Object { '{0}={1}' -f $_.Name, $_.Enabled }) | Sort-Object) -join ','
          Set-Content -LiteralPath "$env:OUT\unattended-before.json" -Value (@{ deny = $deny; rdpRules = $rdpRules } | ConvertTo-Json)
          Write-Host "before: fDenyTSConnections $deny; Remote Desktop firewall rules: $rdpRules"

          $global:LASTEXITCODE = 0
          & 'C:\rpa-ci\package\rpa-windows-x64\Install-Rpa.ps1' -User rpa-ci-unattended -Unattended -AllowFrom 127.0.0.1 -Force
          Assert ($LASTEXITCODE -eq 0) "Install-Rpa.ps1 -Unattended exits 0 (it was $LASTEXITCODE)"

          $record = Get-Content -Raw -LiteralPath "$install\install.json" -Encoding UTF8 | ConvertFrom-Json
          Assert ($record.mode -eq 'unattended' -and $record.user -eq 'rpa-ci-unattended' -and $record.idleSeconds -eq 15 -and $record.runnerInnerPort -eq 18765 -and $record.browserInnerPort -eq 13000 -and (@($record.listenAddresses) -join ',') -eq '0.0.0.0') 'install.json records the mode, the user, the idle time, the ports behind the supervisor and where it listens'
          $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='RPA Supervisor'"
          Assert ($service.State -eq 'Running' -and $service.StartMode -eq 'Auto' -and $service.StartName -eq 'LocalSystem') 'the service RPA Supervisor runs as LocalSystem and starts with Windows'
          Assert ($service.PathName -eq ('"{0}\runner\RpaSupervisor.exe"' -f $install)) "the service runs the installed RpaSupervisor.exe, its path quoted ($($service.PathName))"
          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort 8765, 3000 -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -eq $service.ProcessId })
          Assert ($listeners.Count -ge 2) 'the service listens on port 8765 and 3000'
          foreach ($rule in 'RPA-Runner-In', 'RPA-Browser-In') {
            $found = Get-NetFirewallRule -Name $rule
            Assert (($found | Get-NetFirewallApplicationFilter).Program -eq "$install\runner\RpaSupervisor.exe" -and (@(($found | Get-NetFirewallAddressFilter).RemoteAddress) -join ',') -eq '127.0.0.1') "firewall rule $rule is for the RPA Supervisor, from 127.0.0.1 only"
          }
          $rdpUsers = ((New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-555').Translate([Security.Principal.NTAccount]).Value -split '\\')[-1]
          $groups = @(([ADSI]"WinNT://$env:COMPUTERNAME/rpa-ci-unattended,user").Groups() | ForEach-Object { $_.GetType().InvokeMember('Name', 'GetProperty', $null, $_, $null) })
          Assert ($groups -contains $rdpUsers) "rpa-ci-unattended is in $rdpUsers"
          Assert ((Get-ItemProperty -LiteralPath $terminal -Name fDenyTSConnections).fDenyTSConnections -eq 0) 'Remote Desktop is on'
          $after = (@(Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue | ForEach-Object { '{0}={1}' -f $_.Name, $_.Enabled }) | Sort-Object) -join ','
          Assert ($after -eq $rdpRules) 'the Remote Desktop firewall rules are as they were'
          $acl = Get-Acl -LiteralPath "$data\supervisor"
          $others = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object { 'S-1-5-18', 'S-1-5-32-544' -notcontains $_.IdentityReference.Value })
          Assert ($acl.AreAccessRulesProtected -and $others.Count -eq 0 -and $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-544') 'the supervisor folder is there, and only SYSTEM and Administrators have access'

          $shown = @(& (Join-Path $PSHOME 'powershell.exe') -NoProfile -ExecutionPolicy Bypass -File "$install\scripts\Show-RpaConnection.ps1")
          $shown | ForEach-Object { Write-Host "  | $_" }
          Assert ($shown -contains 'Mode: unattended. The RPA Supervisor signs rpa-ci-unattended in when n8n connects, and out 15 s after the last connection.' -and $shown -contains 'Supervisor: running') 'Show-RpaConnection.ps1 shows the mode and that the supervisor runs'
          Get-Content "$data\supervisor\supervisor.log" -ErrorAction SilentlyContinue | Select-Object -Last 20 | ForEach-Object { Write-Host "  log | $_" }

      # The sign-in through the supervisor: every session of the bot user is signed out, then the scenario connects to
      # the public port, which signs the bot user in; the session is there after the scenario and gone after the idle
      # time. The scenario client runs in this job's session, not in the bot user's, so its copy to the clipboard
      # cannot reach the run's app (RPA_SCENARIO_OTHER_SESSION leaves that one check out).
      # continue-on-error: a loopback Remote Desktop sign-in has not been seen on a hosted runner yet, and a refusal
      # there must not keep the package from being uploaded. Its result shows on the step; the check is made on a real
      # Windows Server in any case.
      - name: Run the scenario through the RPA Supervisor (a session is made, and signed out after the idle time)
        continue-on-error: true
        timeout-minutes: 12
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $data = Join-Path $env:ProgramData 'RPA Runner'
          $quser = Join-Path ([Environment]::SystemDirectory) 'quser.exe'
          function Get-BotSessions { $ErrorActionPreference = 'Continue'; @(& $quser rpa-ci-unattended 2>$null | Select-Object -Skip 1 | ForEach-Object { "$_".Trim() } | Where-Object { $_ }) }
          Write-Host "::add-mask::$(([IO.File]::ReadAllText((Join-Path $data 'token'))).Trim())"

          $output = @('n' | & "$install\runner\RpaPolicy.exe" apply (Join-Path $env:GITHUB_WORKSPACE 'desktop\installer\test\ci-policy-change.json') --yes)
          Assert ($LASTEXITCODE -eq 0) 'RpaPolicy.exe allows the two demo apps'
          foreach ($session in Get-BotSessions) {
            # USERNAME, SESSIONNAME (empty for a disconnected session), ID, STATE, ...
            if ($session -match '\s(\d+)\s+(Active|Disc)\s') { & (Join-Path ([Environment]::SystemDirectory) 'logoff.exe') $Matches[1] }
          }
          for ($i = 0; $i -lt 60 -and (Get-BotSessions).Count -gt 0; $i++) { Start-Sleep -Seconds 1 }
          Assert ((Get-BotSessions).Count -eq 0) 'rpa-ci-unattended has no session'

          $runner = @(& (Join-Path $PSHOME 'powershell.exe') -NoProfile -ExecutionPolicy Bypass -File "$install\scripts\Show-RpaConnection.ps1" | Where-Object { $_ -match '^Runner fingerprint: ((?:[0-9A-F]{2}:){31}[0-9A-F]{2})$' } | ForEach-Object { $Matches[1] })
          Assert ($runner.Count -eq 1) 'the runner started in the bot user session at install time and printed its fingerprint'
          $env:RPA_RUNNER_TOKEN = ([IO.File]::ReadAllText((Join-Path $data 'token'))).Trim()
          $env:RPA_SCENARIO_OTHER_SESSION = '1'
          dotnet desktop/runner/test/Rpa.Runner.Scenario/bin/Release/net8.0/Rpa.Runner.Scenario.dll `
            --url wss://127.0.0.1:8765/rpa/v1 --fingerprint $runner[0] `
            --app "$install\erp-demo\v1\ErpDemo.exe" --app-v2 "$install\erp-demo\v2\ErpDemo.exe" --out "$env:OUT\unattended-scenario"
          $code = $LASTEXITCODE
          $env:RPA_RUNNER_TOKEN = $null
          $sessions = @(Get-BotSessions)
          $sessions | ForEach-Object { Write-Host "  session | $_" }
          Get-Content "$data\supervisor\supervisor.log" -ErrorAction SilentlyContinue | Select-Object -Last 30 | ForEach-Object { Write-Host "  log | $_" }
          Assert ($code -eq 0) "the protocol scenario passes through the RPA Supervisor (exit code $code)"
          Assert ($sessions.Count -eq 1) 'the scenario left one session of rpa-ci-unattended'
          for ($i = 0; $i -lt 60 -and (Get-BotSessions).Count -gt 0; $i++) { Start-Sleep -Seconds 1 }
          Assert ((Get-BotSessions).Count -eq 0) 'the supervisor signed rpa-ci-unattended out after the idle time'
          Assert ([bool](Get-Content "$data\supervisor\supervisor.log" | Select-String 'No connection for 15 s; signing rpa-ci-unattended out\.')) 'the log says why it signed out'

      # The uninstall puts back what -Unattended changed: the service, the group membership, Remote Desktop as found.
      - name: Uninstall the install with -Unattended
        timeout-minutes: 10
        shell: powershell
        run: |
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" }; Write-Host "ok: $what" }
          $install = Join-Path $env:ProgramFiles 'RPA Runner'
          $before = Get-Content -Raw -LiteralPath "$env:OUT\unattended-before.json" | ConvertFrom-Json
          Copy-Item (Join-Path $env:ProgramData 'RPA Runner\supervisor\*') "$env:OUT\install-logs\" -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          & "$install\Uninstall-Rpa.ps1"
          Assert ($LASTEXITCODE -eq 0) "Uninstall-Rpa.ps1 exits 0 (it was $LASTEXITCODE)"
          Assert (-not (Get-Service -Name 'RPA Supervisor' -ErrorAction SilentlyContinue)) 'the service RPA Supervisor is gone'
          Assert (-not [Diagnostics.EventLog]::SourceExists('RPA Supervisor')) 'its event source is gone'
          $rdpUsers = ((New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-555').Translate([Security.Principal.NTAccount]).Value -split '\\')[-1]
          $groups = @(([ADSI]"WinNT://$env:COMPUTERNAME/rpa-ci-unattended,user").Groups() | ForEach-Object { $_.GetType().InvokeMember('Name', 'GetProperty', $null, $_, $null) })
          Assert ($groups -notcontains $rdpUsers) "rpa-ci-unattended is no longer in $rdpUsers"
          $deny = (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections).fDenyTSConnections
          Assert ($deny -eq $before.deny) "Remote Desktop is as it was found (fDenyTSConnections $deny)"
          Assert (@(Get-NetFirewallRule -Name 'RPA-*' -ErrorAction SilentlyContinue).Count -eq 0) 'the two firewall rules are gone'

      - name: Collect the installed programs' logs
        if: always()
        timeout-minutes: 2
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\install-logs" | Out-Null
          Copy-Item (Join-Path $env:ProgramData 'RPA Runner\logs\*') "$env:OUT\install-logs\" -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:ProgramData 'RPA Runner\supervisor\*') "$env:OUT\install-logs\" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\install-logs" -ErrorAction SilentlyContinue | ForEach-Object { '{0} {1}' -f $_.Name, $_.Length }
          $global:LASTEXITCODE = 0

      - name: Upload the installed programs' logs and the scenario's snapshots (failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-install-logs
          path: |
            out/install-logs
            out/install-scenario
            out/unattended-scenario
            out/logs/browser-smoke*.log
          retention-days: 14
          if-no-files-found: ignore

      # The package that was installed above, as a zip with its SHA-256, and the Get-Rpa.ps1 that names both; the
      # artifact's id and digest are outputs of the job.
      # Kept 7 days for a pull request (it is about 570 MB), 30 otherwise.
      - name: Upload the Windows package
        id: upload-package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpa-windows-package
          path: |
            out/package/rpa-windows-x64.zip
            out/package/rpa-windows-x64.zip.sha256
            out/package/Get-Rpa.ps1
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload the runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpa-desktop-runner
          path: out/rpa-desktop-runner
          retention-days: 30
          if-no-files-found: error

      - name: Upload the demo app (v1 and v2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erp-demo
          path: out/erp-demo
          retention-days: 30
          if-no-files-found: error
