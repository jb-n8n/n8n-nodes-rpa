# Weekly dependency updates; minor and patch updates arrive as one grouped pull request per ecosystem.
# Majors come one by one. The Playwright image (images/browser/Dockerfile), the engine's playwright-core and playwright
# in images/browser/server/package-lock.json must move together (README: Version matching).
version: 2
updates:
  # The pnpm workspace (pnpm-lock.yaml at the root covers every package).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The rpa-browser image's run-server (images/browser/server/package-lock.json, installed by images/browser/Dockerfile).
  - package-ecosystem: npm
    directory: /images/browser/server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images of docker/n8n.Dockerfile, images/browser/Dockerfile and sandbox/portal/Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directories:
      - /docker
      - /images/browser
      - /sandbox/portal
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Images in docker-compose.yml (pinned by digest).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
